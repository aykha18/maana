[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "maana-api"
version = "0.1.0"
description = "Semantic infrastructure API for Ma'na — governed knowledge, World engine, agents, and retrieval."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Ayub" }
]
dependencies = [
  "fastapi>=0.111.0",
  "sqlmodel>=0.0.22",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "neo4j>=5.21.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "loguru>=0.7.2",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.2",
  "httpx>=0.27.0",
]

[project.scripts]
maana-api = "maana_api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/maana_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
